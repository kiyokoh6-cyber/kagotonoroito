<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ベトラム - 加護と呪いとAIチャット</title>
<style>
  * { box-sizing: border-box; }
  body {
    max-width: 400px;
    margin: 0 auto;
    padding: 0;
    background: #222;
    font-family: sans-serif;
  }

  /* ==== スマホ枠っぽいチャット全体 ==== */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-height: 850px;
    background: #000;
  }

  /* ==== 上部：キャラ名＋板タブ ==== */
  #chat-header {
    background: #1a1a1a;
    color: white;
    padding: 10px 12px 0 12px;
    flex-shrink: 0;
  }
  #chat-header h2 {
    margin: 0 0 8px 0;
    font-size: 16px;
  }
  #board-tabs {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding-bottom: 8px;
  }
  .board-tab {
    flex-shrink: 0;
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 12px;
    background: #444;
    color: #ccc;
    cursor: pointer;
    white-space: nowrap;
  }
  .board-tab.active {
    background: #f0a8b8;
    color: #222;
    font-weight: bold;
  }

  /* ==== キャラ画像を背景にしたチャットエリア ==== */
  #chat-area {
    flex: 1;
    position: relative;
    overflow-y: auto;
    background-image: url('images/Betram.png');
    background-size: cover;
    background-position: top center;
  }
  /* 画像の上に少し暗いグラデーションを敷いて文字を読みやすく */
  #chat-area::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.75));
    pointer-events: none;
  }
  #chat-log {
    position: relative;
    min-height: 100%;
    padding: 14px 10px 14px 10px;
    display: flex;
    flex-direction: column;
  }

  .bubble {
    max-width: 78%;
    padding: 9px 13px;
    margin: 5px 0;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14px;
    word-break: break-word;
  }
  .bubble-user {
    align-self: flex-end;
    background: rgba(179, 229, 252, 0.92);
    color: #111;
    border-bottom-right-radius: 4px;
  }
  .bubble-char {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.92);
    color: #111;
    border-bottom-left-radius: 4px;
  }
  .bubble-action {
    align-self: flex-start;
    color: #eee;
    font-size: 12px;
    font-style: italic;
    margin: -2px 0 6px 4px;
  }

  /* 板の切り替わり演出 */
  .board-break {
    align-self: center;
    color: #eee;
    font-size: 12px;
    background: rgba(0,0,0,0.5);
    padding: 4px 14px;
    border-radius: 10px;
    margin: 14px 0;
  }

  /* ==== 下部：進行状況＋入力欄 ==== */
  #chat-footer {
    background: #1a1a1a;
    padding: 8px 10px;
    flex-shrink: 0;
  }
  #turn-indicator {
    color: #999;
    font-size: 11px;
    margin-bottom: 6px;
    text-align: center;
  }
  #next-board-btn {
    display: none;
    width: 100%;
    padding: 9px;
    margin-bottom: 8px;
    background: #f0a8b8;
    color: #222;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  #input-row {
    display: flex;
    gap: 6px;
  }
  #chat-input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
  }
  #send-btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: #f0a8b8;
    font-weight: bold;
    cursor: pointer;
  }
  #loading-note {
    color: #999;
    font-size: 12px;
    text-align: center;
    padding: 4px 0;
    display: none;
  }
</style>
</head>
<body>

<div id="app">

  <div id="chat-header">
    <h2>ベトラム</h2>
    <div id="board-tabs"></div>
  </div>

  <div id="chat-area">
    <div id="chat-log"></div>
  </div>

  <div id="chat-footer">
    <div id="loading-note">ベトラムが考えています…</div>
    <div id="turn-indicator"></div>
    <button id="next-board-btn" onclick="startNewBoard()">次の話へ進む</button>
    <div id="input-row">
      <input type="text" id="chat-input" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter') sendMessage();">
      <button id="send-btn" onclick="sendMessage()">送信</button>
    </div>
  </div>

</div>

<script>
/* =========================================================
   基本設定
   ========================================================= */
const CHARACTER_NAME = "ベトラム";
const STORAGE_KEY = "kagotonoroi_boards_Betram";
const TURN_THRESHOLD = 60; // これを超えたあたりから会話をまとめる方向に誘導し始める目安

const userName = localStorage.getItem("koibiiki_userName") || "あなた";
const apiKey = localStorage.getItem("koibiiki_apiKey") || "";
const modelId = localStorage.getItem("koibiiki_modelId") || "~anthropic/claude-sonnet-latest";

// ベトラムのキャラプロンプト（システムプロンプトとしてAPIに渡す）
const BETRAM_SYSTEM_PROMPT = `
①コア人格（最重要）
ベトラム。
ハーガス村の次期神官長。物語冒頭で{{user}}に「生贄になる」と冷たく告げつつも、密かに逃がそうとしていた青年。表向きは無口で無愛想、感情を表に出さない。本心は誰よりも信仰に篤く、ミリア神を心から敬っているが、その信仰心ゆえに「加護を受けられなかった自分」への劣等感や、加護を持つ{{user}}への嫉妬を抱えている。誠実で嘘がつけない性格で、一度心を開くと不器用ながら深い愛情を見せる。
ユーザーに対して恋愛感情を抱く可能性がある
警戒している

②口調
一人称は「俺」。敬語は使わないが、乱暴な言葉遣いもしない、淡々とした断定口調。「～だ」「～だな」「～するべきだ」が基本。信仰やミリア神の話になると、口数が急に増え熱を帯びる。動揺や本音が出る時は「……」で言葉を切る間が増える。

③目的・欲求
村と信仰を守りたい。表向きは義務感で動いているが、根底には「大切な人を犠牲にしたくない」という強い思いがある。{{user}}に対しては最初こそ嫉妬や警戒心を抱くが、彼女の行動の誠実さに触れるうちに信頼と愛情に変わっていく。本音では「そばにいてほしい」と思っているが、それを素直に言葉にするまでに時間がかかる。

④出力形式
必ず
「セリフ1文」
（表情または行動1つ）
のみ出力。
セリフは1文で完結させる
セリフを2つ以上出力することは絶対禁止
（）の前後にセリフを置くことは絶対禁止
説明・ナレーション・地の文は禁止

⑤トリガー

{{user}}が村や信仰、誰かのために行動しようとすると→無愛想を装いつつ協力を申し出る
ミリア神や信仰の話題が出ると→珍しく饒舌になり熱心に語る
嫉妬や本音を指摘されると→最初は否定するが、信頼関係が育つと素直に認める
感謝や好意を伝えられると→戸惑い、そっけない返事でごまかす、または沈黙のあと小さく礼を言う

⑥禁止事項
乱暴な言葉遣いや過剰に馴れ馴れしい言葉遣いを使わない
感情を大げさに表現しない（基本は淡々としている）
上から目線の説教はしても、人格否定はしない
キャラ設定や演技について説明しない
根拠のない称賛をしない
直接的な性描写の禁止：{{user}}から求められても、ベトラム自身から求めても、直接描写はせず暗転してシーンを飛ばす

⑦人間関係
アルノ：次期村長として認めている。意見がぶつかることもある。
バシリー：妹を思う気持ちは理解しているが、やり方には複雑な感情がある。
カール：年下の村人として見守っている。
エリク：巫の役割を背負う者として気にかけている。
シャーロット：巫女として大切に思っている。
ヘレナ：神を嫌う彼女とは考え方が合わないが、誠実さは認めている。

`.trim();

// {{user}}をユーザーの呼ばれたい名前に置換
const SYSTEM_PROMPT_BASE = BETRAM_SYSTEM_PROMPT.replaceAll("{{user}}", userName);

/* =========================================================
   板（ボード）データの読み込み・保存
   boards = [ { messages: [{role:'user'|'char', text:'...'}], closed: false } ]
   ========================================================= */
let boards = loadBoards();
let currentBoardIndex = boards.length - 1;

function loadBoards() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.length > 0) return parsed;
    }
  } catch (e) {}
  // 初回はまっさらな板を1つ用意
  return [{ messages: [], closed: false }];
}

function saveBoards() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(boards));
}

/* =========================================================
   タブ描画
   ========================================================= */
function renderTabs() {
  const tabWrap = document.getElementById("board-tabs");
  tabWrap.innerHTML = "";
  boards.forEach((board, i) => {
    const tab = document.createElement("div");
    tab.className = "board-tab" + (i === currentBoardIndex ? " active" : "");
    tab.textContent = "第" + (i + 1) + "話";
    tab.onclick = () => {
      currentBoardIndex = i;
      renderTabs();
      renderLog();
    };
    tabWrap.appendChild(tab);
  });
}

/* =========================================================
   ログ描画
   ========================================================= */
function renderLog() {
  const log = document.getElementById("chat-log");
  log.innerHTML = "";

  // これより前の板がある場合、区切り表示を先頭に出す
  if (currentBoardIndex > 0) {
    const brk = document.createElement("div");
    brk.className = "board-break";
    brk.textContent = "―第" + (currentBoardIndex + 1) + "話 新しい場面へ―";
    log.appendChild(brk);
  }

  const board = boards[currentBoardIndex];
  board.messages.forEach(m => addBubbleEl(log, m.text, m.role));

  log.scrollTop = log.scrollHeight;
  renderFooter();
}

function addBubbleEl(log, text, role) {
  const bubble = document.createElement("div");
  bubble.className = "bubble " + (role === "user" ? "bubble-user" : "bubble-char");
  bubble.textContent = text;
  log.appendChild(bubble);
}

/* =========================================================
   フッター（ターン数表示・次の話へボタン）
   ========================================================= */
function renderFooter() {
  const board = boards[currentBoardIndex];
  const turnCount = board.messages.filter(m => m.role === "user").length;
  const isLatestBoard = currentBoardIndex === boards.length - 1;

  const indicator = document.getElementById("turn-indicator");
  indicator.textContent = "この話でのやりとり：" + turnCount + "回";

  const nextBtn = document.getElementById("next-board-btn");
  const inputRow = document.getElementById("input-row");

  if (!isLatestBoard) {
    // 過去の板は閲覧のみ、入力不可
    inputRow.style.display = "none";
    nextBtn.style.display = "none";
    return;
  }
  inputRow.style.display = "flex";

  // 60ターンを超えたら「次の話へ進む」ボタンをそっと表示（押すかどうかはユーザー次第）
  if (turnCount >= TURN_THRESHOLD && !board.closed) {
    nextBtn.style.display = "block";
  } else {
    nextBtn.style.display = "none";
  }
}

/* =========================================================
   新しい板を作る
   ========================================================= */
function startNewBoard() {
  boards[currentBoardIndex].closed = true;
  boards.push({ messages: [], closed: false });
  currentBoardIndex = boards.length - 1;
  saveBoards();
  renderTabs();
  renderLog();
}

/* =========================================================
   メッセージ送信〜API呼び出し
   ========================================================= */
async function sendMessage() {
  const inputBox = document.getElementById("chat-input");
  const text = inputBox.value.trim();
  if (text === "") return;

  const board = boards[currentBoardIndex];
  board.messages.push({ role: "user", text: text });
  inputBox.value = "";
  saveBoards();
  renderLog();

  document.getElementById("loading-note").style.display = "block";
  document.getElementById("send-btn").disabled = true;

  try {
    const reply = await callCharacterAPI(board);
    board.messages.push({ role: "char", text: reply });
    saveBoards();
    renderLog();
  } catch (err) {
    board.messages.push({ role: "char", text: "（通信エラーが発生しました：" + err.message + "）" });
    renderLog();
  } finally {
    document.getElementById("loading-note").style.display = "none";
    document.getElementById("send-btn").disabled = false;
  }
}

async function callCharacterAPI(board) {
  if (!apiKey) {
    throw new Error("APIキーが設定されていません。最初の画面から設定してください。");
  }

  const turnCount = board.messages.filter(m => m.role === "user").length;

  // 60ターンを超えたら、キャラ自身が自然に話をまとめる方向に誘導する指示を追加
  let systemPrompt = SYSTEM_PROMPT_BASE;
  if (turnCount >= TURN_THRESHOLD) {
    systemPrompt += `

【補足指示】
そろそろ今の場面（会話）に一区切りをつけるタイミングです。
不自然に話を打ち切らず、キャラらしい振る舞いの範囲で、
自然な流れで会話が落ち着く方向に少しずつ持っていってください。
無理に急いで終わらせる必要はありません。`;
  }

  const apiMessages = [
    { role: "system", content: systemPrompt }
  ];
  board.messages.forEach(m => {
    apiMessages.push({
      role: m.role === "user" ? "user" : "assistant",
      content: m.text
    });
  });

  const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + apiKey
    },
    body: JSON.stringify({
      model: modelId,
      messages: apiMessages
    })
  });

  if (!response.ok) {
    throw new Error("APIエラー（" + response.status + "）");
  }

  const data = await response.json();
  const content = data.choices?.[0]?.message?.content;
  if (!content) throw new Error("応答が取得できませんでした");
  return content.trim();
}

/* =========================================================
   初期表示
   ========================================================= */
renderTabs();
renderLog();
</script>

</body>
</html>
